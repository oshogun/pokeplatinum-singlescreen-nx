[binaries]
c       = ['/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc']
cpp     = ['/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++']
ar      = ['/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar']
strip   = ['false']
pkg-config = ['/usr/bin/pkg-config']

[properties]
# SoundTouch cross-built for Switch into <repo>/nx_deps/switch (see README) + devkitPro portlibs
pkg_config_libdir = ['@DIRNAME@' / '..' / 'nx_deps/switch/lib/pkgconfig', '/opt/devkitpro/portlibs/switch/lib/pkgconfig']

[host_machine]
system      = 'bare metal'
# Same workaround as upstream cybervisi0n/pokeplatinum: the NX build is really aarch64
cpu_family  = 'x86_64'
cpu         = 'x86_64'
endian      = 'little'
